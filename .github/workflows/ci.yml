name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      # No private-module authentication step, deliberately: this module's
      # whole purpose is that it needs none. If a dependency ever arrives that
      # requires a token, this job fails — which is the intended alarm, not an
      # oversight to work around by adding credentials here.
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test with 90% statement coverage minimum
        working-directory: backend
        run: |
          go test -coverprofile=coverage.out ./...
          total_coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')"
          if [ -z "$total_coverage" ]; then
            echo "coverage report did not contain a total"
            exit 1
          fi
          awk -v total_coverage="$total_coverage" 'BEGIN {
            if (total_coverage + 0 < 90) {
              printf "total statement coverage %s%% is below the required 90%%\\n", total_coverage
              exit 1
            }
            printf "total statement coverage %s%% meets the required 90%%\\n", total_coverage
          }'

  grants:
    name: grants build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: grants/go.mod
      # grants depends on the backend module via its published tag (proxy
      # fetch, not a local replace), plus golang-jwt/jwt and dalgo — all
      # public modules, so no private-module auth is needed here either.
      - name: Build
        working-directory: grants
        run: go build ./...
      - name: Vet
        working-directory: grants
        run: go vet ./...
      - name: Test with 90% statement coverage minimum
        working-directory: grants
        run: |
          go test -coverprofile=coverage.out ./...
          total_coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')"
          if [ -z "$total_coverage" ]; then
            echo "coverage report did not contain a total"
            exit 1
          fi
          awk -v total_coverage="$total_coverage" 'BEGIN {
            if (total_coverage + 0 < 90) {
              printf "total statement coverage %s%% is below the required 90%%\\n", total_coverage
              exit 1
            }
            printf "total statement coverage %s%% meets the required 90%%\\n", total_coverage
          }'

  no_dependencies:
    name: stdlib-only invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Reject any non-stdlib dependency
        working-directory: backend
        # A `require` block, or a go.sum, means this module stopped being
        # importable without credentials for someone. That is the one property
        # it exists to hold.
        run: |
          if [ -f go.sum ]; then echo "go.sum present: this module must stay dependency-free"; exit 1; fi
          if grep -qE '^\s*require' go.mod; then echo "go.mod has a require block: this module must stay dependency-free"; exit 1; fi
          echo "stdlib-only: ok"
